<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAG Chat</title>
    <style>
        :root {
            --bg: #0e0f12;
            --panel: #14161b;
            --panel2: #101217;
            --stroke: rgba(255, 255, 255, 0.10);
            --stroke2: rgba(255, 255, 255, 0.16);
            --text: rgba(255, 255, 255, 0.92);
            --muted: rgba(255, 255, 255, 0.62);
            --muted2: rgba(255, 255, 255, 0.45);
            --shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            --shadow2: 0 10px 30px rgba(0, 0, 0, 0.35);
            --r: 16px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            color: var(--text);
            background:
                radial-gradient(900px 600px at 20% 10%, rgba(255, 255, 255, 0.05), transparent 55%),
                radial-gradient(900px 600px at 80% 90%, rgba(255, 255, 255, 0.03), transparent 55%),
                linear-gradient(180deg, #0b0c0f, var(--bg));
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 28px 16px 40px;
        }

        .top {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 650;
            letter-spacing: 0.2px;
        }

        .title p {
            margin: 0;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.35;
        }

        .api {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke);
            border-radius: 999px;
            padding: 10px 12px;
            box-shadow: var(--shadow2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-width: 340px;
        }

        .api label {
            font-size: 12px;
            color: var(--muted2);
            white-space: nowrap;
        }

        .api input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 12.5px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.04);
        }

        .dot.ok {
            background: rgba(255, 255, 255, 0.85);
        }

        .dot.bad {
            background: rgba(255, 255, 255, 0.35);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.04));
            border: 1px solid var(--stroke);
            border-radius: var(--r);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .cardHead {
            padding: 14px 14px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .cardHead .left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .cardHead h2 {
            margin: 0;
            font-size: 14px;
            letter-spacing: 0.2px;
            font-weight: 650;
        }

        .cardHead .sub {
            font-size: 12.5px;
            color: var(--muted);
        }

        .cardBody {
            padding: 14px;
        }

        .textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            border-radius: 14px;
            padding: 12px 12px;
            border: 1px solid var(--stroke2);
            background: rgba(0, 0, 0, 0.22);
            color: var(--text);
            outline: none;
            font-size: 14px;
            line-height: 1.45;
        }

        .textarea:focus {
            border-color: rgba(255, 255, 255, 0.30);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.06);
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btnRow {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 13px;
            cursor: pointer;
            transition: 140ms ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .btn[disabled] {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        .btnPrimary {
            background: rgba(255, 255, 255, 0.14);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .meta {
            display: flex;
            gap: 12px;
            align-items: center;
            color: var(--muted);
            font-size: 12.5px;
        }

        .file {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px dashed rgba(255, 255, 255, 0.18);
            background: rgba(0, 0, 0, 0.18);
            width: 100%;
        }

        .file input[type="file"] {
            width: 100%;
            color: var(--muted);
            font-size: 12.5px;
        }

        .fileName {
            color: var(--muted);
            font-size: 12.5px;
            margin-top: 8px;
        }

        .chat {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 520px;
            overflow: auto;
            padding-right: 4px;
        }

        .chat::-webkit-scrollbar {
            width: 10px;
        }

        .chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.10);
            border: 2px solid rgba(0, 0, 0, 0.35);
            border-radius: 999px;
        }

        .msg {
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(0, 0, 0, 0.22);
            padding: 12px 12px;
        }

        .msg .who {
            font-size: 12px;
            color: var(--muted2);
            margin-bottom: 6px;
        }

        .msg pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13.5px;
            line-height: 1.5;
            color: rgba(255, 255, 255, 0.90);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.60);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: rgba(255, 255, 255, 0.90);
            border-radius: 14px;
            padding: 10px 12px;
            box-shadow: var(--shadow2);
            opacity: 0;
            pointer-events: none;
            transition: 180ms ease;
            max-width: min(760px, calc(100% - 24px));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 13px;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-3px);
        }

        .loader {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            font-size: 12.5px;
            color: var(--muted);
        }

        .spinner {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid rgba(255, 255, 255, 0.20);
            border-top-color: rgba(255, 255, 255, 0.75);
            animation: rot 0.8s linear infinite;
        }

        @keyframes rot {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 720px) {
            .api {
                min-width: unset;
                width: 100%;
            }

            .top {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="top">
            <div class="title">
                <h1>RAG Chat</h1>
                <p>Minimal UI for testing your API endpoint.</p>
            </div>

            <div class="api">
                <span class="dot" id="dot"></span>
                <label>API</label>
                <input id="apiUrl" spellcheck="false" />
                <button class="btn" id="pingBtn">Ping</button>
            </div>
        </div>

        <div class="grid">
            <section class="card">
                <div class="cardHead">
                    <div class="left">
                        <h2>Input</h2>
                        <div class="sub">Send a question to your backend.</div>
                    </div>
                    <div id="loader" class="loader" style="display:none;">
                        <span class="spinner" aria-hidden="true"></span>
                        <span>Working</span>
                    </div>
                </div>

                <div class="cardBody">
                    <textarea id="q" class="textarea" placeholder="Type your question..."></textarea>

                    <div class="row">
                        <div class="btnRow">
                            <button class="btn btnPrimary" id="sendBtn">Send</button>
                            <button class="btn" id="copyBtn">Copy last answer</button>
                            <button class="btn" id="clearBtn">Clear</button>
                        </div>
                        <div class="meta">
                            <span>Requests: <span id="reqCount">0</span></span>
                            <span>Latency: <span id="latency">-</span></span>
                        </div>
                    </div>

                    <div style="height:12px"></div>

                    <div class="file">
                        <input id="fileInput" type="file" />
                        <button class="btn" id="uploadBtn" style="white-space: nowrap;">Upload file</button>
                    </div>
                    <div class="fileName" id="fileName">No file selected.</div>
                </div>
            </section>

            <section class="card">
                <div class="cardHead">
                    <div class="left">
                        <h2>Conversation</h2>
                        <div class="sub">Latest messages.</div>
                    </div>
                </div>
                <div class="cardBody">
                    <div class="chat" id="chat"></div>
                </div>
            </section>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // CONFIG
        const DEFAULT_API_URL = "http://127.0.0.1:8000/question";

        // DOM
        const el = (id) => document.getElementById(id);
        const apiUrlEl = el("apiUrl");
        const pingBtn = el("pingBtn");
        const dotEl = el("dot");

        const qEl = el("q");
        const sendBtn = el("sendBtn");
        const copyBtn = el("copyBtn");
        const clearBtn = el("clearBtn");
        const loaderEl = el("loader");

        const reqCountEl = el("reqCount");
        const latencyEl = el("latency");
        const chatEl = el("chat");

        const fileInput = el("fileInput");
        const uploadBtn = el("uploadBtn");
        const fileNameEl = el("fileName");

        const toastEl = el("toast");

        // State
        let reqCount = 0;
        let lastAnswer = "";
        let selectedFile = null;

        // Persist API URL
        apiUrlEl.value = localStorage.getItem("rag_api_url_v2") || DEFAULT_API_URL;
        apiUrlEl.addEventListener("change", () => {
            localStorage.setItem("rag_api_url_v2", apiUrlEl.value.trim());
            toast("API URL saved.");
        });

        function toast(msg) {
            toastEl.textContent = msg;
            toastEl.classList.add("show");
            clearTimeout(toastEl._t);
            toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
        }

        function setLoading(v) {
            loaderEl.style.display = v ? "inline-flex" : "none";
            sendBtn.disabled = v;
            pingBtn.disabled = v;
            copyBtn.disabled = v;
            clearBtn.disabled = v;
            uploadBtn.disabled = v;
        }

        function setDot(state) {
            dotEl.classList.remove("ok", "bad");
            if (state === "ok") dotEl.classList.add("ok");
            if (state === "bad") dotEl.classList.add("bad");
        }

        function addMsg(who, text) {
            const box = document.createElement("div");
            box.className = "msg";

            const whoEl = document.createElement("div");
            whoEl.className = "who";
            whoEl.textContent = who;

            const pre = document.createElement("pre");
            pre.textContent = text;

            box.appendChild(whoEl);
            box.appendChild(pre);
            chatEl.appendChild(box);
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function postQuestion(question) {
            const url = apiUrlEl.value.trim();
            const t0 = performance.now();

            const res = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });

            const ms = Math.round(performance.now() - t0);
            latencyEl.textContent = ms + " ms";

            const ct = res.headers.get("content-type") || "";
            let data;
            if (ct.includes("application/json")) data = await res.json();
            else data = { raw: await res.text() };

            if (!res.ok) {
                const msg = data?.detail ? JSON.stringify(data.detail) : JSON.stringify(data, null, 2);
                throw new Error(`HTTP ${res.status}: ${msg}`);
            }
            return data;
        }

        function extractAnswer(data) {
            if (data && typeof data === "object") {
                if (typeof data.answer === "string") return data.answer;
                if (typeof data.received === "string") return data.received; // echo mode
                if (typeof data.raw === "string") return data.raw;
                return JSON.stringify(data, null, 2);
            }
            return String(data);
        }

        async function send() {
            const question = qEl.value.trim();
            if (!question) {
                toast("Type a question first.");
                qEl.focus();
                return;
            }

            addMsg("You", question);
            qEl.value = "";

            setLoading(true);
            setDot(null);

            try {
                reqCount++;
                reqCountEl.textContent = String(reqCount);

                const data = await postQuestion(question);
                setDot("ok");

                const answer = extractAnswer(data);
                lastAnswer = answer;
                addMsg("Assistant", answer);
            } catch (err) {
                setDot("bad");
                addMsg("Assistant", String(err));
            } finally {
                setLoading(false);
                qEl.focus();
            }
        }

        async function ping() {
            setLoading(true);
            try {
                await postQuestion("ping");
                setDot("ok");
                toast("Ping OK.");
            } catch {
                setDot("bad");
                toast("Ping failed.");
            } finally {
                setLoading(false);
            }
        }

        async function copyLast() {
            if (!lastAnswer) {
                toast("Nothing to copy.");
                return;
            }
            try {
                await navigator.clipboard.writeText(lastAnswer);
                toast("Copied.");
            } catch {
                toast("Copy blocked by browser.");
            }
        }

        function clearAll() {
            chatEl.innerHTML = "";
            lastAnswer = "";
            toast("Cleared.");
            qEl.focus();
        }

        // File Selection Logic
        fileInput.addEventListener("change", () => {
            selectedFile = fileInput.files && fileInput.files[0];
            if (selectedFile) {
                fileNameEl.textContent = `Selected: ${selectedFile.name} (Ready to upload)`;
            } else {
                fileNameEl.textContent = "No file selected.";
            }
        });

        // File Upload Logic
        uploadBtn.addEventListener("click", async () => {
            if (!selectedFile) {
                toast("Please select a file first!");
                return;
            }

            fileNameEl.textContent = `Uploading: ${selectedFile.name}...`;

            const formData = new FormData();
            formData.append("file", selectedFile);

            const baseUrl = apiUrlEl.value.trim().replace("/question", "");
            const uploadUrl = baseUrl + "/upload";

            setLoading(true);

            try {
                const res = await fetch(uploadUrl, {
                    method: "POST",
                    body: formData
                });

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.detail || "Failed to upload file");
                }

                toast("File uploaded successfully!");
                fileNameEl.textContent = `Uploaded: ${selectedFile.name}`;
                addMsg("System", `File ${selectedFile.name} landed safely on the server!`);

            } catch (err) {
                toast("Upload error.");
                fileNameEl.textContent = `Error: ${selectedFile.name}`;
                addMsg("System", `Upload error: ${err.message}`);
            } finally {
                setLoading(false);
                fileInput.value = "";
                selectedFile = null;
            }
        });

        // Events
        sendBtn.addEventListener("click", send);
        pingBtn.addEventListener("click", ping);
        copyBtn.addEventListener("click", copyLast);
        clearBtn.addEventListener("click", clearAll);

        qEl.addEventListener("keydown", (e) => {
            // Enter sends, Shift+Enter makes a new line
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        // init
        addMsg("System", "Ready.");
        qEl.focus();
    </script>
</body>

</html>
