<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Assistant</title>

    <style>
        :root {
            --bg: #0b1020;
            --card2: #0b1324;
            --border: rgba(255, 255, 255, 0.12);
            --text: rgba(255, 255, 255, 0.96);
            --muted: rgba(255, 255, 255, 0.68);
            --accent: #2563eb;
            --accent2: rgba(37, 99, 235, 0.22);
            --bubble: rgba(255, 255, 255, 0.07);
            --radius: 18px;
            --shadow: 0 26px 70px rgba(0, 0, 0, 0.55);
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background:
                radial-gradient(1100px 700px at 18% 18%, rgba(37, 99, 235, 0.22), transparent 55%),
                radial-gradient(900px 600px at 82% 22%, rgba(16, 185, 129, 0.12), transparent 60%),
                radial-gradient(900px 700px at 50% 95%, rgba(245, 158, 11, 0.10), transparent 60%),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            padding: 22px;
        }

        .shell {
            width: min(880px, 100%);
            border-radius: 26px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            overflow: hidden;
        }

        .topbar {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: rgba(0, 0, 0, 0.18);
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .2px;
        }

        .pill {
            font-size: 12px;
            color: var(--muted);
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.04);
        }

        .chat {
            height: 460px;
            padding: 18px 18px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.10), rgba(0, 0, 0, 0.00));
        }

        .msg {
            max-width: 76%;
            padding: 14px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 15px;
            letter-spacing: .1px;
            white-space: pre-wrap;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--accent2);
            border: 1px solid rgba(37, 99, 235, 0.45);
        }

        .msg.bot {
            align-self: flex-start;
            background: var(--bubble);
            border: 1px solid var(--border);
        }

        .composer {
            padding: 14px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: rgba(0, 0, 0, 0.18);
        }

        textarea {
            flex: 1;
            resize: none;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: var(--card2);
            color: var(--text);
            padding: 14px 14px;
            font-size: 15px;
            outline: none;
            min-height: 52px;
            max-height: 160px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        button {
            height: 52px;
            padding: 0 18px;
            border-radius: 18px;
            border: 1px solid rgba(37, 99, 235, 0.55);
            background: rgba(37, 99, 235, 0.28);
            color: var(--text);
            font-weight: 750;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .upload {
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.14);
        }

        .filewrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 18px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.04);
        }

        .filelabel {
            font-size: 13px;
            color: var(--muted);
            white-space: nowrap;
        }

        input[type="file"] {
            width: 100%;
            color: var(--muted);
            font-size: 13px;
        }

        .status {
            flex: 0 0 auto;
            font-size: 12px;
            color: var(--muted);
            min-width: 110px;
            text-align: right;
        }

        /* Sources */
        .sources {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sources-title {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: .2px;
        }

        details.src {
            border: 1px solid rgba(255, 255, 255, 0.10);
            background: rgba(0, 0, 0, 0.18);
            border-radius: 14px;
            overflow: hidden;
        }

        details.src summary {
            cursor: pointer;
            list-style: none;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: rgba(255, 255, 255, 0.90);
            font-size: 13px;
        }

        details.src summary::-webkit-details-marker {
            display: none;
        }

        .src-left {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.86);
            font-size: 12px;
        }

        .score {
            color: var(--muted);
            font-size: 12px;
        }

        .src-body {
            padding: 10px 12px 12px;
            color: rgba(255, 255, 255, 0.84);
            font-size: 13px;
            line-height: 1.55;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="topbar">
            <div class="title">Assistant</div>
            <div class="pill" id="statusPill">Ready</div>
        </div>

        <div class="chat" id="chat"></div>

        <div class="composer">
            <textarea id="question" placeholder="Type a message..."></textarea>
            <button id="send">Send</button>
        </div>

        <div class="upload">
            <div class="filewrap">
                <div class="filelabel">PDF</div>
                <input id="file" type="file" accept="application/pdf" />
            </div>
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
        /** ✅ SET YOUR API HERE (FastAPI) */
        const API_BASE = "http://127.0.0.1:8000";

        const chat = document.getElementById("chat");
        const questionInput = document.getElementById("question");
        const sendBtn = document.getElementById("send");
        const fileInput = document.getElementById("file");
        const statusBox = document.getElementById("status");
        const statusPill = document.getElementById("statusPill");

        function setPill(text) { statusPill.textContent = text || "Ready"; }
        function setStatus(text) { statusBox.textContent = text || ""; }

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "msg " + type;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        function normalizeSource(s) {
            const filename = s.filename ?? s.file ?? (typeof s.source === "string" ? s.source.split("#")[0] : null) ?? "unknown";
            const page = s.page ?? s.p ?? s.page_number ?? null;
            let score = s.score ?? s.similarity ?? s.distance ?? null;
            if (typeof score === "number") score = Number(score); else score = null;
            const preview = s.text_preview ?? s.preview ?? s.text ?? s.chunk ?? "";
            return { filename, page, score, preview };
        }

        function renderSources(parentMsgDiv, sources) {
            if (!Array.isArray(sources) || sources.length === 0) return;

            const wrap = document.createElement("div");
            wrap.className = "sources";

            const title = document.createElement("div");
            title.className = "sources-title";
            title.textContent = "Sources";
            wrap.appendChild(title);

            sources.forEach((raw) => {
                const s = normalizeSource(raw);

                const det = document.createElement("details");
                det.className = "src";

                const sum = document.createElement("summary");

                const left = document.createElement("div");
                left.className = "src-left";

                const fileBadge = document.createElement("span");
                fileBadge.className = "badge";
                fileBadge.textContent = s.filename;
                left.appendChild(fileBadge);

                if (s.page !== null && s.page !== undefined && s.page !== "") {
                    const pageBadge = document.createElement("span");
                    pageBadge.className = "badge";
                    pageBadge.textContent = "p. " + s.page;
                    left.appendChild(pageBadge);
                }

                sum.appendChild(left);

                const score = document.createElement("span");
                score.className = "score";
                score.textContent = (typeof s.score === "number") ? ("score " + s.score.toFixed(4)) : "";
                sum.appendChild(score);

                det.appendChild(sum);

                const body = document.createElement("div");
                body.className = "src-body";
                body.textContent = (s.preview || "").trim() || "No preview.";
                det.appendChild(body);

                wrap.appendChild(det);
            });

            parentMsgDiv.appendChild(wrap);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendQuestion() {
            const text = (questionInput.value || "").trim();
            if (!text) return;

            addMessage(text, "user");
            questionInput.value = "";
            sendBtn.disabled = true;
            setPill("Thinking…");

            const typing = addMessage("…", "bot");

            try {
                const res = await fetch(`${API_BASE}/question`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: text })
                });

                let data = {};
                try { data = await res.json(); } catch { }

                typing.textContent = "";

                if (!res.ok) {
                    typing.textContent = "Request failed.";
                    return;
                }

                typing.textContent = data.answer || "No response.";

                if (Array.isArray(data.sources) && data.sources.length > 0) {
                    renderSources(typing, data.sources);
                }

            } catch (e) {
                typing.textContent = "Connection error.";
            } finally {
                sendBtn.disabled = false;
                setPill("Ready");
            }
        }

        async function uploadPdf() {
            const file = fileInput.files?.[0];
            if (!file) return;

            if (!file.name.toLowerCase().endsWith(".pdf")) {
                setStatus("PDF only");
                fileInput.value = "";
                setTimeout(() => setStatus(""), 2000);
                return;
            }

            setStatus("Uploading…");
            setPill("Uploading…");

            const form = new FormData();
            form.append("file", file);

            try {
                const res = await fetch(`${API_BASE}/upload`, { method: "POST", body: form });

                let data = {};
                try { data = await res.json(); } catch { }

                if (!res.ok) {
                    setStatus("Failed");
                    return;
                }

                setStatus("Uploaded");
                addMessage("Document uploaded.", "bot");
            } catch (e) {
                setStatus("Error");
            } finally {
                fileInput.value = "";
                setTimeout(() => setStatus(""), 2000);
                setPill("Ready");
            }
        }

        sendBtn.addEventListener("click", sendQuestion);
        questionInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendQuestion();
            }
        });
        fileInput.addEventListener("change", uploadPdf);
    </script>
</body>

</html>
